name: Host-Agnostic Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  host-agnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check published content is host-agnostic
        run: sh scripts/check-host-agnostic.sh
