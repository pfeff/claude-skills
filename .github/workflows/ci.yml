name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin.json
        run: python3 -c "import json; json.load(open('.claude-plugin/plugin.json'))"

      - name: Check required fields in plugin.json
        run: |
          python3 -c "
          import json, sys
          manifest = json.load(open('.claude-plugin/plugin.json'))
          required = ['name', 'version', 'description', 'license']
          missing = [f for f in required if f not in manifest]
          if missing:
              print(f'Missing required fields: {missing}')
              sys.exit(1)
          print('All required fields present')
          "

      - name: Verify SKILL.md files exist
        run: |
          skills=(testing-without-mocks diataxis compound ci-feedback-loop)
          for skill in "${skills[@]}"; do
            if [ ! -f "skills/$skill/SKILL.md" ]; then
              echo "Missing: skills/$skill/SKILL.md"
              exit 1
            fi
          done
          echo "All SKILL.md files present"

      - name: Shellcheck
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 shellcheck

      - name: Check for leaked personal references
        run: |
          # Catch real personal paths (/Users/<name>/, /home/<name>/)
          # Allow: ~/.claude/skills/ (standard install path in docs)
          #        /home/user/ (generic example path)
          #        /home/runner/ (GitHub Actions runner path)
          if grep -r --include='*.md' --include='*.json' --include='*.tmpl' \
            -E '(/Users/[a-zA-Z]|/home/[a-zA-Z])' \
            --exclude-dir=.git . \
            | grep -v -E '(/home/user/|/home/runner/)'; then
            echo "Found leaked personal paths"
            exit 1
          fi
          echo "No leaked personal paths found"
