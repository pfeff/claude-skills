name: Skill Lint

# Checks only the skill files a PR actually touches — not the whole tree.
# The corpus carries known pre-existing allowed-tools gaps (see
# scripts/check-allowed-tools.py docstring / repo history); scoping to the
# diff catches new instances of the defect without blocking unrelated PRs
# on unrelated pre-existing debt.
on:
  pull_request:
    branches: [main]
    paths:
      - 'skills/**'

jobs:
  bounded-external-doc-script-equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Guards against drift between the teaching copy of run_bounded_external
      # (references/bounded-external-waits.md) and the executable copy
      # (run-bounded-external.sh). Not picked up by the top-level
      # `python3 -m unittest discover -s scripts` command, which only walks
      # scripts/ — so it needs an explicit CI step, same as check-allowed-tools.py
      # below.
      - name: Doc/script equivalence test for run_bounded_external
        run: python3 -m unittest discover -s skills/self-verify/scripts -p 'test_bounded_external_equivalence.py'

  allowed-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unit tests for the validator
        run: python3 -m unittest discover -s scripts -p 'test_check_allowed_tools.py'

      # Compute the changed-file list and run the check in a SINGLE step. The
      # list is a shell variable piped to xargs — never a multi-line step output
      # interpolated into `run:` (that injects raw newlines and breaks the
      # script on multi-file PRs). base_ref is passed via env, not `${{ }}` in
      # the script body, for the same injection-safety reason.
      - name: Check skill allowed-tools on changed files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          files=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- 'skills/**/SKILL.md' 'skills/**/operations/*.md')
          if [ -z "$files" ]; then
            echo "No changed skill files; nothing to check."
            exit 0
          fi
          echo "$files" | xargs python3 scripts/check-allowed-tools.py
